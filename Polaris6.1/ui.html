<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
</head>
<body>
  <div id="combined-plugin-float-div">
    <h2 id="title">Polaris Scan</h2>
    <div style="display: flex; gap: 10px;">
      <button id="highlight-button">高亮提醒设置</button>
      <button id="encode-decode-button">编码解码</button>
    </div>
    <div id="version-info">Polaris Scan v0.4</div>
    <div id="buttons-div">
      <button class="action-button" data-action="domain">域名提取</button>
      <button class="action-button" data-action="phone">电话提取</button>
      <button class="action-button" data-action="api">API 提取</button>
      <button class="action-button" data-action="path">Path 提取</button>
      <button class="action-button" data-action="js">JS 提取</button>
      <button class="action-button" data-action="regex">自定义添加正则表达式</button>
      <button class="action-button" data-action="modules">工具模块</button>
      <button class="action-button" data-action="pentest">渗透测试</button>
    </div>
    <div id="combined-plugin-result"></div>
    <button id="dark-mode-button">暗模式</button>
  </div>
</body>
</html>
